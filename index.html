    <script>
        // Apply saved/system theme before first paint to avoid a light flash (mirrors Nav.jsx).
        try {
            var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (t === 'dark') {
                document.documentElement.classList.add('dark-theme');
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        } catch (e) {}
    </script>
    <title>Paritosh Gandre | Data Scientist & AI Engineer</title>
